name: telugu_tunes
description: Private Telugu music client for a small listening circle.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  file_picker: ^11.0.3
  shared_preferences: ^2.5.5
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.18
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1
  palette_generator: ^0.3.3+7
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
