name: Deploy backend to Oracle

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch:

concurrency:
  group: oracle-backend-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/yugasaimanikanta0313/telugu-tunes-backend

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test backend
        working-directory: backend
        run: mvn --batch-mode test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: oracle-production
    steps:
      - name: Configure Oracle SSH access
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Sign Oracle server in to the container registry
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/oracle.key ubuntu@"$ORACLE_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy and verify backend
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          ssh -i ~/.ssh/oracle.key ubuntu@"$ORACLE_HOST" "IMAGE='$IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail

          test -s /opt/telugu-tunes/backend.env || {
            echo "Missing /opt/telugu-tunes/backend.env on the Oracle server."
            exit 1
          }

          docker pull "$IMAGE"
          docker rm -f telugu-tunes-api 2>/dev/null || true
          docker run -d \
            --name telugu-tunes-api \
            --restart unless-stopped \
            --env-file /opt/telugu-tunes/backend.env \
            --memory 700m \
            --memory-swap 1400m \
            -p 8080:8080 \
            "$IMAGE"

          for attempt in $(seq 1 36); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then
              docker image prune -f >/dev/null
              echo "Telugu Tunes backend is healthy."
              exit 0
            fi
            sleep 5
          done

          docker logs --tail 200 telugu-tunes-api
          echo "Backend health check failed."
          exit 1
          REMOTE
